<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>框架 / 01 新任务</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="00 工作台线稿" data-flow="框架 / 01 新任务" class="w-[1440px] h-[960px] flex flex-row items-start justify-start bg-[#FFFFFF]">
  <div data-name="Sidebar" class="flex flex-col w-[244px] h-full items-start justify-start gap-[6px] p-[14px] bg-[#F2F2F2]">
    <div data-name="Brand" class="flex flex-row w-full h-fit items-center justify-start gap-3 py-[6px] px-1">
      <p data-name="BrandName" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[19px] font-[400] leading-[1.2] text-[#252525]">Alva</p>
      <div data-name="CollapseSidebar" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
        <p data-name="CollapseSidebarText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">收起</p>
      </div>
    </div>
    <div data-name="NewTask" data-click="框架/01 新任务" class="flex flex-row w-full h-fit items-center justify-center py-2 px-3 rounded-[6px] bg-[#FFFFFF] border border-[#D7D7D7] border-inside">
      <p data-name="NewTaskText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">+  新任务</p>
    </div>
    <div data-name="Search" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
      <p data-name="SearchText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">搜索</p>
    </div>
    <div data-name="Automations" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
      <p data-name="AutomationsText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">自动化</p>
    </div>
    <div data-name="Customize" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
      <p data-name="CustomizeText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">自定义</p>
    </div>
    <div data-name="Companions" data-click="伙伴/12 伙伴与群聊" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
      <p data-name="CompanionsText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">伙伴与群聊</p>
    </div>
    <div data-name="ProjectGroup" class="flex flex-col w-full h-fit items-start justify-start gap-1 py-3">
      <div data-name="ProjectsLabel" class="flex flex-row w-full h-fit items-center justify-start gap-3">
        <p data-name="ProjectsLabelText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#666666]">项目</p>
        <div data-name="AddProject" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
          <p data-name="AddProjectText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">+</p>
        </div>
      </div>
      <div data-name="CurrentProject" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
        <p data-name="CurrentProjectText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">v  alva-agent</p>
      </div>
      <div data-name="CurrentThread" data-click="框架/02 对话进行中" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-4 rounded-[6px]">
        <p data-name="CurrentThreadText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">整理桌面工作台</p>
      </div>
      <div data-name="SecondThread" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-4 rounded-[6px]">
        <p data-name="SecondThreadText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">复查插件加载</p>
      </div>
      <div data-name="AnotherProject" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
        <p data-name="AnotherProjectText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">&gt;  我的资料</p>
      </div>
    </div>
    <div data-name="RecentGroup" class="flex flex-col w-full h-fit items-start justify-start gap-1 py-2">
      <p data-name="RecentLabel" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#666666]">最近</p>
      <div data-name="RecentResearch" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
        <p data-name="RecentResearchText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">整理本周资料</p>
      </div>
      <div data-name="RecentModels" class="flex flex-col w-full h-fit items-start justify-start py-[9px] px-[10px] rounded-[6px]">
        <p data-name="RecentModelsText" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">测试模型表现</p>
      </div>
    </div>
    <div data-name="SidebarSpace" class="flex flex-col w-full h-full items-start justify-start">
    </div>
    <div data-name="Account" class="flex flex-row w-full h-fit items-center justify-start gap-3 p-1">
      <p data-name="AccountName" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">Smallraw</p>
      <div data-name="OpenSettings" data-click="框架/04 模型与连接" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
        <p data-name="OpenSettingsText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">设置</p>
      </div>
    </div>
  </div>
  <div data-name="Main" class="flex flex-col w-full h-full items-start justify-start bg-[#FFFFFF]">
    <div data-name="ThreadHeader" class="flex flex-row w-full h-[58px] items-center justify-start gap-3 px-6 bg-[#FFFFFF]">
      <p data-name="ThreadTitle" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#252525]">新任务</p>
      <div data-name="ProjectInfo" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
        <p data-name="ProjectInfoText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">alva-agent v</p>
      </div>
      <div data-name="ShowArtifact" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
        <p data-name="ShowArtifactText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">面板</p>
      </div>
      <div data-name="MoreActions" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
        <p data-name="MoreActionsText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">…</p>
      </div>
    </div>
    <div data-name="WelcomeArea" class="flex flex-col w-full h-full items-center justify-center pb-[120px] px-6">
      <div data-name="WelcomeContent" class="flex flex-col w-[720px] h-fit items-start justify-start gap-[20px]">
        <p data-name="WelcomeTitle" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[28px] font-[400] leading-[1.2] text-[#252525]">开始一项新任务</p>
        <p data-name="WelcomeProject" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#666666]">在 alva-agent 中工作</p>
        <div data-name="Composer" class="flex flex-col w-full h-[150px] items-start justify-start gap-[14px] p-4 rounded-[10px] bg-[#FFFFFF] border border-[#CFCFCF] border-inside">
          <p data-name="Prompt" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[15px] font-[400] leading-[1.2] text-[#666666]">说明你要完成的事，@ 引用文件或资料</p>
          <div data-name="ComposerSpace" class="flex flex-col w-full h-full items-start justify-start">
          </div>
          <div data-name="ComposerControls" class="flex flex-row w-full h-fit items-center justify-start gap-3">
            <div data-name="Attach" data-click="选择器/06 添加与模式" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
              <p data-name="AttachText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">+</p>
            </div>
            <div data-name="Permissions" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
              <p data-name="PermissionsText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">每次询问 v</p>
            </div>
            <div data-name="ComposerControlSpace" class="flex flex-col w-full h-[1px] items-start justify-start">
            </div>
            <div data-name="SelectAgentModel" data-click="选择器/05 Agent 与模型" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px]">
              <p data-name="SelectAgentModelText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">ALVA · 默认模型 v</p>
            </div>
            <div data-name="Send" data-click="框架/02 对话进行中" class="flex flex-row w-fit h-fit items-center justify-center py-2 px-3 rounded-[6px] bg-[#252525]">
              <p data-name="SendText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#FFFFFF]">发送</p>
            </div>
          </div>
        </div>
        <div data-name="Suggestions" class="flex flex-row w-full h-fit items-center justify-start gap-3">
          <div data-name="SuggestProject" class="flex flex-row w-full h-fit items-center justify-center py-2 px-3 rounded-[6px] bg-[#FFFFFF] border border-[#D7D7D7] border-inside">
            <p data-name="SuggestProjectText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">整理项目结构</p>
          </div>
          <div data-name="SuggestResearch" class="flex flex-row w-full h-fit items-center justify-center py-2 px-3 rounded-[6px] bg-[#FFFFFF] border border-[#D7D7D7] border-inside">
            <p data-name="SuggestResearchText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">整理项目资料</p>
          </div>
          <div data-name="SuggestFile" class="flex flex-row w-full h-fit items-center justify-center py-2 px-3 rounded-[6px] bg-[#FFFFFF] border border-[#D7D7D7] border-inside">
            <p data-name="SuggestFileText" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[13px] font-[400] leading-[1.2] text-[#252525]">检查一份文件</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
