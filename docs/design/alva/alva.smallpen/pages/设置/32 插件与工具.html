<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>设置 / 32 插件与工具</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="01 产品界面" class="w-viewport-width h-viewport-height flex flex-row items-start justify-start gap-3 pt-2 pb-3 px-3 bg-canvas">
  <!-- 需求与标注见 docs/design/alva/requirements/*.md：req_alva_navigation_native_shell、req_alva_navigation_settings -->
  <sp-use component="SettingsNav" data-name="SettingsNav" props="Category: Plugins" class="w-navigation h-full">
    <sp-use data-name="Developer" data-click="设置/37 开发者测试"></sp-use>
    <sp-use data-name="Gateway" data-click="设置/36 Gateway"></sp-use>
    <sp-use data-name="General" data-click="设置/31 通用"></sp-use>
    <sp-use data-name="Models" data-click="设置/23 模型与连接"></sp-use>
    <sp-use data-name="Plugins" data-click="设置/32 插件与工具"></sp-use>
    <sp-use data-name="Security" data-click="设置/35 权限与安全"></sp-use>
    <sp-use data-name="Skills" data-click="设置/33 规则与 Skills"></sp-use>
    <sp-use data-name="Storage" data-click="设置/34 数据与存储"></sp-use>
  </sp-use>
  <div data-name="SettingsRegion" class="flex flex-col w-full h-full items-start justify-start rounded-card bg-surface">
    <div data-name="ReturnRow" class="flex flex-row w-full h-control-height items-center justify-start px-6">
      <sp-use component="Button" data-name="HeaderReturn" props="Content: Leading; Kind: Ghost; State: Default" data-click="工作台/22 对话与面板" class="w-fit h-control-height">
        <sp-use data-name="Icon" props="Name: ChevronLeft"></sp-use>
        <p data-name="Label">返回工作台</p>
      </sp-use>
    </div>
    <div data-name="SettingsMain" class="flex flex-col w-full h-full items-start justify-start gap-4 p-6 max-w-[960px]">
      <div data-name="PageTitle" class="flex flex-row w-full h-fit items-start justify-start gap-2">
        <div data-name="PageTitleCopy" class="flex flex-col w-full h-fit items-start justify-start gap-2">
          <p data-name="PageTitleTitle" class="w-full h-fit type-heading-strong text-text">插件与工具</p>
          <p data-name="PageTitleDescription" class="w-full h-fit type-caption text-secondary hidden">安装、启用与授权分别管理。</p>
        </div>
        <sp-use component="Button" data-name="InstallPlugin" props="Content: Leading; Kind: Primary; State: Default" class="w-fit h-control-height">
          <sp-use data-name="Icon" props="Name: Plus"></sp-use>
          <p data-name="Label">安装插件</p>
        </sp-use>
      </div>
      <div data-name="PluginToolbar" class="flex flex-row w-full h-fit items-center justify-start gap-2">
        <sp-use component="Input" data-name="PluginSearch" props="Kind: Search; State: Default" class="w-full h-control-height">
          <p data-name="Value">搜索已安装插件…</p>
        </sp-use>
        <div data-name="PluginFilter" class="flex flex-row w-fit h-fit items-center justify-start gap-1 p-1 rounded-ctrl bg-subtle">
          <sp-use component="Segment" data-name="PluginFilter0" props="State: Selected" class="w-fit h-[32px]">
            <p data-name="Label">全部</p>
          </sp-use>
          <sp-use component="Segment" data-name="PluginFilter1" props="State: Default" class="w-fit h-[32px]">
            <p data-name="Label" class="w-[43px]">已启用</p>
          </sp-use>
          <sp-use component="Segment" data-name="PluginFilter2" props="State: Default" class="w-fit h-[32px]">
            <p data-name="Label" class="w-[43px]">需处理</p>
          </sp-use>
        </div>
      </div>
      <div data-name="PluginList" class="flex flex-col w-full h-fit items-start justify-start gap-3 bg-transparent">
        <sp-use component="SkillRow" data-name="FilesPlugin" props="State: Shared" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description">内置工具 · 当前项目 · 已启用</p>
            <p data-name="Title">文件与目录</p>
          </div>
          <sp-use data-name="Enabled" props="State: On"></sp-use>
        </sp-use>
        <sp-use component="SkillRow" data-name="ShellPlugin" props="State: Shared" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description">内置工具 · 每次询问</p>
            <p data-name="Title">命令执行</p>
          </div>
          <sp-use data-name="Enabled" props="State: On"></sp-use>
        </sp-use>
        <sp-use component="SkillRow" data-name="McpPlugin" props="State: Shared" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description">2 个连接 · 工具按需发现</p>
            <p data-name="Title">MCP 连接</p>
          </div>
          <sp-use data-name="Enabled" props="State: On"></sp-use>
        </sp-use>
        <sp-use component="SkillRow" data-name="ScriptPlugin" props="State: Owned" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description">JS / WASM · 按宿主能力装配</p>
            <p data-name="Title">脚本插件</p>
          </div>
          <sp-use data-name="Enabled" props="State: On"></sp-use>
        </sp-use>
      </div>
      <div data-name="McpConnections" class="flex flex-col w-full h-fit items-start justify-start gap-3 bg-transparent">
        <div data-name="McpTitle" class="flex flex-row w-full h-fit items-start justify-start gap-2">
          <div data-name="McpTitleCopy" class="flex flex-col w-full h-fit items-start justify-start gap-2">
            <p data-name="McpTitleTitle" class="w-full h-fit type-subtitle-strong text-text">MCP 连接</p>
            <p data-name="McpTitleDescription" class="w-full h-fit type-caption text-secondary hidden">目录与正文按需加载。</p>
          </div>
          <sp-use component="Button" data-name="AddMcp" props="Content: Leading; Kind: Secondary; State: Default" class="w-fit h-control-height">
            <sp-use data-name="Icon" props="Name: Plus"></sp-use>
            <p data-name="Label">添加连接</p>
          </sp-use>
        </div>
        <sp-use component="ResourceRow" data-name="LocalMcp" props="Kind: Link" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description">当前项目 · 连接就绪</p>
            <p data-name="Title">项目文档服务</p>
          </div>
        </sp-use>
        <sp-use component="ResourceRow" data-name="PendingMcp" props="Kind: Link" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description">尚未连接</p>
            <p data-name="Title">开发工具服务</p>
          </div>
        </sp-use>
      </div>
      <sp-use component="Notice" data-name="PluginScope" props="Tone: Info" class="w-full h-fit hidden">
        <div data-name="Copy">
          <p data-name="Description">工具执行仍经过现有权限检查；不同平台可用能力分别标明。</p>
          <p data-name="Title">启用不等于授权</p>
        </div>
      </sp-use>
    </div>
  </div>
</body>
</html>
