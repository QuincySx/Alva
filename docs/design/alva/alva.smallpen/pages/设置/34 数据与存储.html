<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>设置 / 34 数据与存储</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="01 产品界面" class="w-viewport-width h-viewport-height flex flex-row items-start justify-start gap-3 pt-2 pb-3 px-3 bg-canvas">
  <!-- 需求与标注见 docs/design/alva/requirements/*.md：req_alva_navigation_native_shell、req_alva_navigation_settings -->
  <sp-use component="SettingsNav" data-name="SettingsNav" props="Category: Storage" class="w-navigation h-full">
    <sp-use data-name="Developer" data-click="设置/37 开发者测试"></sp-use>
    <sp-use data-name="Gateway" data-click="设置/36 Gateway"></sp-use>
    <sp-use data-name="General" data-click="设置/31 通用"></sp-use>
    <sp-use data-name="Models" data-click="设置/23 模型与连接"></sp-use>
    <sp-use data-name="Plugins" data-click="设置/32 插件与工具"></sp-use>
    <sp-use data-name="Security" data-click="设置/35 权限与安全"></sp-use>
    <sp-use data-name="Skills" data-click="设置/33 规则与 Skills"></sp-use>
    <sp-use data-name="Storage" data-click="设置/34 数据与存储"></sp-use>
  </sp-use>
  <div data-name="SettingsRegion" class="flex flex-col w-full h-full items-start justify-start rounded-card bg-surface">
    <div data-name="ReturnRow" class="flex flex-row w-full h-control-height items-center justify-start px-6">
      <sp-use component="Button" data-name="HeaderReturn" props="Content: Leading; Kind: Ghost; State: Default" data-click="工作台/22 对话与面板" class="w-fit h-control-height">
        <sp-use data-name="Icon" props="Name: ChevronLeft"></sp-use>
        <p data-name="Label">返回工作台</p>
      </sp-use>
    </div>
    <div data-name="SettingsMain" class="flex flex-col w-full h-full items-start justify-start gap-4 p-6 max-w-[800px]">
      <div data-name="PageTitle" class="flex flex-row w-full h-fit items-start justify-start gap-2">
        <div data-name="PageTitleCopy" class="flex flex-col w-full h-fit items-start justify-start gap-2">
          <p data-name="PageTitleTitle" class="w-full h-fit type-heading-strong text-text">数据与存储</p>
          <p data-name="PageTitleDescription" class="w-full h-fit type-caption text-secondary hidden">数据归属与存储组件独立选择。</p>
        </div>
      </div>
      <div data-name="StorageBackend" class="flex flex-col w-full h-fit items-start justify-start gap-3 bg-transparent">
        <div data-name="BackendTitle" class="flex flex-row w-full h-fit items-start justify-start gap-2">
          <div data-name="BackendTitleCopy" class="flex flex-col w-full h-fit items-start justify-start gap-2">
            <p data-name="BackendTitleTitle" class="w-full h-fit type-subtitle-strong text-text">当前存储</p>
          </div>
        </div>
        <div data-name="BackendFields" class="flex flex-row w-full h-fit items-center justify-start gap-2">
          <sp-use component="Field" data-name="StorageProvider" props="State: Default" class="w-full h-fit">
            <sp-use data-name="Control" props="Kind: Select; State: Default">
              <p data-name="Value">本地持久存储</p>
            </sp-use>
            <p data-name="Hint" class="hidden"></p>
            <p data-name="Title">存储组件</p>
          </sp-use>
          <sp-use component="Field" data-name="StorageScope" props="State: Default" class="w-full h-fit">
            <sp-use data-name="Control" props="Kind: Select; State: Default">
              <p data-name="Value">当前用户</p>
            </sp-use>
            <p data-name="Hint" class="hidden"></p>
            <p data-name="Title">数据范围</p>
          </sp-use>
        </div>
        <sp-use component="Notice" data-name="StoragePort" props="Tone: Info" class="w-full h-fit hidden">
          <div data-name="Copy">
            <p data-name="Description">可由产品装配本地、内存或远端实现；未安装的组件不显示为可用。</p>
            <p data-name="Title">存储通过统一能力接入</p>
          </div>
        </sp-use>
        <sp-use component="SettingRow" data-name="StorageDetails" props="Control: Action" class="w-full h-fit">
          <sp-use data-name="Action">
            <p data-name="Label">查看详情</p>
          </sp-use>
          <div data-name="Copy">
            <p data-name="Description">查看组件声明、数据位置与可用性。</p>
            <p data-name="Title">连接与健康状态</p>
          </div>
        </sp-use>
      </div>
      <div data-name="DataManagement" class="flex flex-col w-full h-fit items-start justify-start gap-3 bg-transparent">
        <div data-name="DataTitle" class="flex flex-row w-full h-fit items-start justify-start gap-2">
          <div data-name="DataTitleCopy" class="flex flex-col w-full h-fit items-start justify-start gap-2">
            <p data-name="DataTitleTitle" class="w-full h-fit type-subtitle-strong text-text">数据管理</p>
          </div>
        </div>
        <sp-use component="SettingRow" data-name="Export" props="Control: Action" class="w-full h-fit">
          <sp-use data-name="Action">
            <p data-name="Label">导出</p>
          </sp-use>
          <div data-name="Copy">
            <p data-name="Description">显式选择会话、伙伴或共享内容。</p>
            <p data-name="Title">导出数据</p>
          </div>
        </sp-use>
        <sp-use component="SettingRow" data-name="Retention" props="Control: Action" class="w-full h-fit">
          <sp-use data-name="Action">
            <p data-name="Label">配置</p>
          </sp-use>
          <div data-name="Copy">
            <p data-name="Description">原始记录、附件与派生文件分别设置。</p>
            <p data-name="Title">保留策略</p>
          </div>
        </sp-use>
        <sp-use component="SettingRow" data-name="Cache" props="Control: Action" class="w-full h-fit">
          <sp-use data-name="Action">
            <p data-name="Label">查看</p>
          </sp-use>
          <div data-name="Copy">
            <p data-name="Description">只清理可重建内容，保留原始文件。</p>
            <p data-name="Title">派生缓存</p>
          </div>
        </sp-use>
      </div>
      <sp-use component="Notice" data-name="StorageChange" props="Tone: Warning" class="w-full h-fit">
        <div data-name="Copy">
          <p data-name="Description">切换连接和迁移历史分开操作，不自动搬运或删除原数据。</p>
          <p data-name="Title">切换存储前先确认数据范围</p>
        </div>
      </sp-use>
    </div>
  </div>
</body>
</html>
