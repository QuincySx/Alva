<sp-component name="DialogHeader">
  <div data-name="DialogHeader" class="flex flex-row w-[640px] h-fit items-start justify-start gap-2 pb-4">
    <div data-name="Copy" class="flex flex-col w-full h-fit items-start justify-start gap-2">
      <p data-name="Title" class="w-full h-fit text-text type-heading-strong">配置你的工作方式</p>
      <p data-name="Description" class="w-full h-fit text-secondary type-caption">选择需要的选项，再保存到当前作用域。</p>
    </div>
    <sp-use component="IconButton" data-name="Close" props="State: Default" class="w-control-icon h-control-icon">
      <sp-use data-name="Icon" props="Name: Close"></sp-use>
    </sp-use>
  </div>
</sp-component>
