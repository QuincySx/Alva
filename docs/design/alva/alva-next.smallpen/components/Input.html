<sp-component name="Input" props="Kind: Text | Search | Select | Password; State: Default | Focus | Error | Disabled | Loading | ErrorFocus | ReadOnly">

    <sp-use data-name="Trailing" props="Name: Warning" class="shown">

    </sp-use>
  </sp-variant>

    <sp-use data-name="Trailing" props="Name: Loader" class="shown">
