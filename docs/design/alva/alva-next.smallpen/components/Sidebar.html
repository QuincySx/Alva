<sp-component name="Sidebar" props="Area: Work | Partners | Settings | New">
  <div data-name="Sidebar" class="flex flex-col w-sidebar h-[960px] items-start justify-start gap-2 p-3 bg-canvas">
    <div data-name="Brand" class="flex flex-row w-full h-[44px] items-center justify-start gap-2 p-1">
      <div data-name="BrandMark" class="flex flex-col w-[32px] h-[32px] items-center justify-center bg-accent rounded-ctrl">
        <sp-use component="Icon" data-name="Mark" props="Name: Sparkles" class="w-icon-size h-icon-size">
          <p data-name="Glyph" class="type-subtitle-strong-lh1 text-on-accent">a</p>
        </sp-use>
      </div>
      <p data-name="BrandLabel" class="w-full h-fit text-text type-subtitle-strong">Alva</p>
    </div>
    <sp-use component="Button" data-name="NewTask" props="Kind: Secondary; State: Default; Content: Leading" class="w-full h-control-height">
      <p data-name="Label">新任务</p>
      <sp-use data-name="Icon" props="Name: Plus"></sp-use>
    </sp-use>
    <sp-use component="NavItem" data-name="Search" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">搜索任务与资料</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Search"></sp-use>
    </sp-use>
    <sp-use component="NavItem" data-name="Partners" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">伙伴与群聊</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Users"></sp-use>
    </sp-use>
    <sp-use component="NavItem" data-name="Automations" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">自动化</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Calendar"></sp-use>
    </sp-use>
    <p data-name="ProjectTitle" class="w-full h-fit mt-2 text-secondary type-caption">项目</p>
    <sp-use component="NavItem" data-name="Project" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">alva-agent</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Folder"></sp-use>
    </sp-use>
    <sp-use component="NavItem" data-name="CurrentThread" props="State: Selected" class="w-full h-control-row">
      <p data-name="Label">整理桌面工作台</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Chat"></sp-use>
    </sp-use>
    <sp-use component="NavItem" data-name="SecondThread" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">检查插件加载</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Chat"></sp-use>
    </sp-use>
    <sp-use component="NavItem" data-name="AnotherProject" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">我的资料</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Folder"></sp-use>
    </sp-use>
    <p data-name="RecentTitle" class="w-full h-fit mt-2 text-secondary type-caption">最近</p>
    <sp-use component="NavItem" data-name="RecentTask" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">整理模型连接</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Clock"></sp-use>
    </sp-use>
    <sp-use component="NavItem" data-name="RecentResearch" props="State: Default" class="w-full h-control-row">
      <p data-name="Label">本周资料研究</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Clock"></sp-use>
    </sp-use>
    <div data-name="SidebarSpace" class="flex flex-col w-full h-full items-start justify-start">
    </div>
    <div data-name="Footer" class="flex flex-row w-full h-fit items-center justify-start gap-2 p-1">
      <sp-use component="Avatar" data-name="Owner" props="Kind: Person" class="w-[28px] h-[28px]">
        <p data-name="Label">S</p>
      </sp-use>
      <p data-name="OwnerName" class="w-full h-fit text-text type-body">Smallraw</p>
      <sp-use component="IconButton" data-name="OpenSettings" props="State: Default" class="w-control-icon h-control-icon">
        <sp-use data-name="Icon" props="Name: Settings"></sp-use>
      </sp-use>
    </div>
  </div>
  <sp-variant when="Area: Partners">
    <sp-use data-name="Partners" props="State: Selected">
      <p data-name="Label">伙伴与群聊</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Users"></sp-use>
    </sp-use>
    <sp-use data-name="CurrentThread" props="State: Default">
      <p data-name="Label">整理桌面工作台</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Chat"></sp-use>
    </sp-use>
  </sp-variant>
  <sp-variant when="Area: Settings">
    <sp-use data-name="CurrentThread" props="State: Default">
      <p data-name="Label">整理桌面工作台</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Chat"></sp-use>
    </sp-use>
    <div data-name="Footer">
      <sp-use data-name="OpenSettings" props="State: Pressed">
        <sp-use data-name="Icon" props="Name: Settings"></sp-use>
      </sp-use>
    </div>
  </sp-variant>
  <sp-variant when="Area: New">
    <sp-use data-name="CurrentThread" props="State: Default">
      <p data-name="Label">整理桌面工作台</p>
      <p data-name="Meta">&#8203;</p>
      <sp-use data-name="Icon" props="Name: Chat"></sp-use>
    </sp-use>
  </sp-variant>
</sp-component>
