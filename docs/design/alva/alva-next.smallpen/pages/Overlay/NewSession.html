<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Overlay / NewSession</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="旧视觉草稿（暂不评审）" class="w-[520px] h-[560px] flex flex-col items-start justify-start gap-[20px] p-6 bg-[#FFFFFF]">
  <div data-name="OverlayHeading" class="flex flex-row w-full h-fit items-center justify-start gap-4">
    <div data-name="OverlayHeadingText" class="flex flex-col w-full h-fit items-start justify-start gap-1">
      <p data-name="OverlayHeadingTitle" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[20px] font-[600] leading-[1.2] text-[#182230]">开始新的对话</p>
      <p data-name="OverlayHeadingSubtitle" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#536276]">项目对话或独立会话</p>
    </div>
    <sp-use component="Button" data-name="CloseOverlay" props="Kind: Ghost; State: Default; Content: Text" data-click="back" class="w-[72px] h-[36px]">
      <p data-name="Label">关闭</p>
    </sp-use>
  </div>
  <div data-name="NewSessionTabs" class="flex flex-row w-full h-fit items-center justify-start gap-3">
    <sp-use component="Tab" data-name="ProjectSession" props="State: Selected" class="w-[132px] h-[36px]">
      <p data-name="Label">项目对话</p>
    </sp-use>
    <sp-use component="Tab" data-name="PrivateSession" props="State: Default" class="w-[132px] h-[36px]">
      <p data-name="Label">独立会话</p>
    </sp-use>
  </div>
  <div data-name="NewTitle" class="flex flex-col w-full h-fit items-start justify-start gap-2">
    <p data-name="NewTitleLabel" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#536276]">对话名称</p>
    <sp-use component="Input" data-name="NewTitleInput" props="Kind: Text; State: Default" class="w-full h-[36px]">
      <p data-name="Value">新的项目讨论</p>
    </sp-use>
  </div>
  <div data-name="NewWorkspace" class="flex flex-col w-full h-fit items-start justify-start gap-2">
    <p data-name="NewWorkspaceLabel" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#536276]">工作区</p>
    <sp-use component="Input" data-name="NewWorkspaceInput" props="Kind: Text; State: Default" class="w-full h-[36px]">
      <p data-name="Value">选择项目目录…</p>
    </sp-use>
  </div>
  <div data-name="NewRoute" class="flex flex-col w-full h-fit items-start justify-start gap-2">
    <p data-name="NewRouteLabel" class="w-fit h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#536276]">模型路由</p>
    <sp-use component="Input" data-name="NewRouteInput" props="Kind: Text; State: Default" class="w-full h-[36px]">
      <p data-name="Value">ALVA · 团队网关</p>
    </sp-use>
  </div>
  <p data-name="NewSessionHint" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[14px] font-[400] leading-[1.2] text-[#536276]">创建对话不会发送消息，也不会启动模型。</p>
  <div data-name="NewSessionActions" class="flex flex-row w-full h-fit items-center justify-start gap-3">
    <sp-use component="Button" data-name="NewSessionCancel" props="Kind: Secondary; State: Default; Content: Text" data-click="back" class="w-[104px] h-[36px]">
      <p data-name="Label">取消</p>
    </sp-use>
    <sp-use component="Button" data-name="NewSessionCreate" props="Kind: Primary; State: Default; Content: Text" data-click="Chat/Conversation" class="w-[120px] h-[36px]">
      <p data-name="Label">创建对话</p>
    </sp-use>
  </div>
</body>
</html>
