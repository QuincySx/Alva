<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Overlay / CommandPalette</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="旧视觉草稿（暂不评审）" class="w-[620px] h-[420px] flex flex-col items-start justify-start gap-[20px] p-6 bg-[#FFFFFF]">
  <div data-name="OverlayHeading" class="flex flex-row w-full h-fit items-center justify-start gap-4">
    <div data-name="OverlayHeadingText" class="flex flex-col w-full h-fit items-start justify-start gap-1">
      <p data-name="OverlayHeadingTitle" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[20px] font-[600] leading-[1.2] text-[#182230]">快速打开</p>
      <p data-name="OverlayHeadingSubtitle" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#536276]">输入页面、命令或当前任务</p>
    </div>
    <sp-use component="Button" data-name="CloseOverlay" props="Kind: Ghost; State: Default; Content: Text" data-click="back" class="w-[72px] h-[36px]">
      <p data-name="Label">关闭</p>
    </sp-use>
  </div>
  <sp-use component="Input" data-name="CommandSearch" props="Kind: Text; State: Focus" class="w-full h-[36px]">
    <p data-name="Value">搜索…</p>
  </sp-use>
  <div data-name="Commands" class="flex flex-col w-full h-fit items-start justify-start gap-2">
    <sp-use component="Button" data-name="CommandGoChat" props="Kind: Ghost; State: Default; Content: Text" data-click="Chat/Conversation" class="w-full h-[36px]">
      <p data-name="Label">返回当前对话</p>
    </sp-use>
    <sp-use component="Button" data-name="CommandGoPlugins" props="Kind: Ghost; State: Default; Content: Text" data-click="Capabilities/Plugins" class="w-full h-[36px]">
      <p data-name="Label">插件与能力</p>
    </sp-use>
    <sp-use component="Button" data-name="CommandGoSettings" props="Kind: Ghost; State: Default; Content: Text" data-click="Settings/General" class="w-full h-[36px]">
      <p data-name="Label">打开设置</p>
    </sp-use>
    <sp-use component="Button" data-name="CommandGoDeveloper" props="Kind: Ghost; State: Default; Content: Text" data-click="Developer/IntegrationTests" class="w-full h-[36px]">
      <p data-name="Label">开发者选项</p>
    </sp-use>
  </div>
  <p data-name="CommandHint" class="w-full h-fit font-[Alva_UI_Sans_SC] text-[12px] font-[400] leading-[1.2] text-[#536276]">Esc 关闭 · 焦点返回原来的控件</p>
</body>
</html>
