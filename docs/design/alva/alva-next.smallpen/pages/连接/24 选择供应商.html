<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>连接 / 24 选择供应商</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="01 产品界面" class="w-viewport-width h-viewport-height flex flex-col items-stretch justify-start pt-2 pb-3 px-3 bg-canvas">
  <!-- 需求与标注见 docs/design/alva/requirements/*.md：req_alva_navigation_native_shell、req_alva_navigation_wizard、req_alva_provider_source -->
  <div data-name="SheetReturnRow" class="flex flex-row w-full h-control-height items-center justify-start gap-2 px-6">
    <div data-name="NativeSafeArea" class="flex flex-row w-[50px] h-[32px] items-start justify-start">
    </div>
    <sp-use component="Button" data-name="WizardBack" props="Content: Leading; Kind: Ghost; State: Default" data-click="设置/23 模型与连接" class="w-fit h-control-height">
      <sp-use data-name="Icon" props="Name: ChevronLeft"></sp-use>
      <p data-name="Label" class="w-[99px]">返回模型与连接</p>
    </sp-use>
  </div>
  <div data-name="SheetBody" class="flex flex-col w-full h-full items-center justify-center p-3">
    <div data-name="Dialog" class="flex flex-col w-full h-fit items-start justify-start gap-4 p-6 rounded-card bg-surface shadow-popup max-w-[720px]">
      <sp-use component="DialogHeader" data-name="DialogHeader" class="w-full h-fit">
        <sp-use data-name="Close" data-click="设置/23 模型与连接"></sp-use>
        <div data-name="Copy">
          <p data-name="Description" class="hidden"></p>
          <p data-name="Title">添加供应商</p>
        </div>
      </sp-use>
      <sp-use component="Input" data-name="ProviderSearch" props="Kind: Search; State: Default" class="w-full h-control-height">
        <p data-name="Value">搜索服务…</p>
      </sp-use>
      <div data-name="APISources" class="flex flex-col w-full h-fit items-start justify-start gap-1">
        <p data-name="APITitle" class="w-full h-fit type-caption text-secondary">API 服务</p>
        <sp-use component="MenuItem" data-name="ChooseOpenAI" props="State: Default" data-click="连接/25 配置连接" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description" class="hidden"></p>
            <p data-name="Label">OpenAI</p>
          </div>
          <sp-use data-name="Icon" props="Name: Chip"></sp-use>
          <p data-name="Shortcut" class="hidden"></p>
        </sp-use>
        <sp-use component="MenuItem" data-name="ChooseAnthropic" props="State: Default" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description" class="hidden"></p>
            <p data-name="Label">Anthropic</p>
          </div>
          <sp-use data-name="Icon" props="Name: Chip"></sp-use>
          <p data-name="Shortcut" class="hidden"></p>
        </sp-use>
        <sp-use component="MenuItem" data-name="ChooseGemini" props="State: Default" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description" class="hidden"></p>
            <p data-name="Label">Google Gemini</p>
          </div>
          <sp-use data-name="Icon" props="Name: Sparkles"></sp-use>
          <p data-name="Shortcut" class="hidden"></p>
        </sp-use>
      </div>
      <div data-name="OtherSources" class="flex flex-col w-full h-fit items-start justify-start gap-1">
        <p data-name="OtherTitle" class="w-full h-fit type-caption text-secondary">其他来源</p>
        <sp-use component="MenuItem" data-name="ChooseCustom" props="State: Default" data-click="连接/26 自定义连接" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description" class="shown">兼容 API 或自有服务</p>
            <p data-name="Label">自定义连接</p>
          </div>
          <sp-use data-name="Icon" props="Name: Globe"></sp-use>
          <p data-name="Shortcut" class="hidden"></p>
        </sp-use>
        <sp-use component="MenuItem" data-name="ChooseLocal" props="State: Default" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description" class="shown">连接已经启动的 HTTP 服务</p>
            <p data-name="Label">本地服务</p>
          </div>
          <sp-use data-name="Icon" props="Name: Terminal"></sp-use>
          <p data-name="Shortcut" class="hidden"></p>
        </sp-use>
        <sp-use component="MenuItem" data-name="ChooseAccount" props="State: Default" class="w-full h-fit">
          <div data-name="Copy">
            <p data-name="Description" class="shown">由你选择并确认，只用于对应 Agent</p>
            <p data-name="Label">本机 Agent 账户</p>
          </div>
          <sp-use data-name="Icon" props="Name: Key"></sp-use>
          <p data-name="Shortcut" class="hidden"></p>
        </sp-use>
      </div>
      <div data-name="DialogSpace" class="flex flex-col w-full h-[0px] items-start justify-start hidden">
      </div>
    </div>
  </div>
</body>
</html>
