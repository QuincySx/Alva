[package]
name = "alva-hub-gpui"
version = "0.1.0"
edition = "2021"
description = "ALVA Hub Desktop — Rust-native GPUI build (P0 skeleton)"
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Backend core — migrated verbatim from alva-hub-desktop (no tauri).
alva-engine-adapter-alva = { path = "../alva-engine-adapter-alva" }
alva-engine-adapter-claude = { path = "../alva-engine-adapter-claude" }
alva-engine-adapter-codex = { path = "../alva-engine-adapter-codex" }
alva-engine-adapter-pi = { path = "../alva-engine-adapter-pi" }
alva-engine-runtime = { path = "../alva-engine-runtime" }
alva-app-core = { path = "../alva-app-core" }
alva-app-extension-loader = { path = "../alva-app-extension-loader" }
alva-hub-core = { path = "../alva-hub-core" }
alva-kernel-abi = { path = "../alva-kernel-abi" }
alva-llm-provider = { path = "../alva-llm-provider" }
alva-protocol-skill = { path = "../alva-protocol-skill" }
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

# Main-workspace member (wasm-bindgen upgraded to 0.2.127 to satisfy gpui).

[dev-dependencies]
async-trait = "0.1"
futures-core = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
