[package]
name = "alva-hub-cli"
version = "0.1.0"
edition = "2021"
description = "Headless automation and diagnostics client for Alva Hub"

[[bin]]
name = "alva-hub"
path = "src/main.rs"

[dependencies]
alva-app-core = { path = "../alva-app-core" }
alva-engine-runtime = { path = "../alva-engine-runtime" }
alva-engine-adapter-alva = { path = "../alva-engine-adapter-alva" }
alva-engine-adapter-claude = { path = "../alva-engine-adapter-claude" }
alva-engine-adapter-codex = { path = "../alva-engine-adapter-codex" }
alva-engine-adapter-pi = { path = "../alva-engine-adapter-pi" }
alva-hub-core = { path = "../alva-hub-core" }
alva-llm-provider = { path = "../alva-llm-provider" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
