[package]
name = "alva-engine-adapter-pi"
version = "0.1.0"
edition = "2021"
description = "Pi coding-agent adapter for Alva Hub (pi --mode json)"

[dependencies]
alva-engine-runtime = { path = "../alva-engine-runtime" }
alva-kernel-abi = { path = "../alva-kernel-abi" }
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "fs"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
alva-engine-runtime = { path = "../alva-engine-runtime", features = ["test-support"] }
futures-util = "0.3"
tempfile = "3"
