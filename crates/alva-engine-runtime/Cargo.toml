[package]
name = "alva-engine-runtime"
version = "0.1.0"
edition = "2021"

[features]
# Conformance harness (ticket 16). Never enabled for production builds;
# adapter crates pull it in via dev-dependencies to run five canned
# end-to-end scenarios against their own execute().
test-support = ["dep:futures-util"]

[dependencies]
alva-kernel-abi = { path = "../alva-kernel-abi" }
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
