[package]
name = "alva-app-gpui"
version = "0.1.0"
edition = "2021"
description = "ALVA Desktop — Rust-native GPUI build (P0 skeleton, migrating from alva-app-tauri)"
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Core agent stack (same as alva-app-tauri, minus tauri).
alva-app-core = { path = "../alva-app-core" }
alva-kernel-core = { path = "../alva-kernel-core" }
alva-kernel-abi = { path = "../alva-kernel-abi" }
alva-llm-provider = { path = "../alva-llm-provider" }
alva-protocol-skill = { path = "../alva-protocol-skill" }
alva-agent-extension-builtin = { path = "../alva-agent-extension-builtin" }
alva-app-extension-browser = { path = "../alva-app-extension-browser" }
alva-app-extension-memory = { path = "../alva-app-extension-memory" }
alva-app-extension-loader = { path = "../alva-app-extension-loader" }

async-trait = "0.1"
chrono = "0.4"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
