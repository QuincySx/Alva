[package]
name = "alva-hub-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop-first multi-engine product shell for Alva Hub"

[[bin]]
name = "alva-hub-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
alva-engine-adapter-alva = { path = "../alva-engine-adapter-alva" }
alva-engine-adapter-claude = { path = "../alva-engine-adapter-claude" }
alva-engine-adapter-codex = { path = "../alva-engine-adapter-codex" }
alva-engine-adapter-pi = { path = "../alva-engine-adapter-pi" }
alva-engine-runtime = { path = "../alva-engine-runtime" }
alva-hub-core = { path = "../alva-hub-core" }
alva-kernel-abi = { path = "../alva-kernel-abi" }
alva-llm-provider = { path = "../alva-llm-provider" }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
futures-core = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
