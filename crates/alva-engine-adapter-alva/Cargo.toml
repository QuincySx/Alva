[package]
name = "alva-engine-adapter-alva"
version = "0.1.0"
edition = "2021"
description = "Alva Hub EngineRuntime adapter backed by complete alva-app-core BaseAgent sessions"

[dependencies]
alva-engine-runtime = { path = "../alva-engine-runtime" }
alva-app-core = { path = "../alva-app-core" }
alva-kernel-core = { path = "../alva-kernel-core" }
alva-agent-core = { path = "../alva-agent-core" }
alva-kernel-abi = { path = "../alva-kernel-abi" }
alva-agent-abi = { path = "../alva-agent-abi" }
async-trait = "0.1"
futures-core = "0.3"
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
alva-agent-context = { path = "../alva-agent-context" }
alva-engine-runtime = { path = "../alva-engine-runtime", features = ["test-support"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
alva-test = { path = "../alva-test" }
serde_json = "1"
tempfile = "3"
