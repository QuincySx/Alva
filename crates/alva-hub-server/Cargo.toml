[package]
name = "alva-hub-server"
version = "0.1.0"
edition = "2021"
description = "Headless Alva Hub service: multi-engine HubRuntime over HTTP with SSE event streaming"

[[bin]]
name = "alva-hub-server"
path = "src/main.rs"

[dependencies]
alva-engine-runtime = { path = "../alva-engine-runtime" }
alva-engine-adapter-alva = { path = "../alva-engine-adapter-alva" }
alva-hub-core = { path = "../alva-hub-core" }
alva-kernel-abi = { path = "../alva-kernel-abi" }
alva-llm-provider = { path = "../alva-llm-provider" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-core = "0.3"
futures-util = "0.3"
