[package]
name = "alva-hub-server"
version = "0.1.0"
edition = "2021"
description = "Headless Alva Hub service: reuses the Hub Desktop business library over HTTP + SSE"

[[bin]]
name = "alva-hub-server"
path = "src/main.rs"

[dependencies]
alva-hub-desktop = { path = "../alva-hub-desktop" }
alva-hub-core = { path = "../alva-hub-core" }
alva-engine-runtime = { path = "../alva-engine-runtime" }
alva-llm-provider = { path = "../alva-llm-provider" }
axum = "0.7"
include_dir = "0.7"
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
