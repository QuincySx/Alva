[package]
name = "alva-agent-abi"
version = "0.1.0"
edition = "2021"
description = "Agent contract layer: Task / Scope / Spawn / Phase / Analytics — product concepts above the kernel, below the SDK assembly"

[dependencies]
alva-kernel-abi = { path = "../alva-kernel-abi" }
alva-kernel-bus = { path = "../alva-kernel-bus" }
alva-macros = { path = "../alva-macros" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1"
