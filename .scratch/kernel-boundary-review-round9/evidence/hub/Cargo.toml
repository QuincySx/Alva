# INPUT: Current local Hub/engine crates and cached test dependencies.
# OUTPUT: Isolated deterministic review executable.
# POS: Round 9 Hub lifecycle evidence, outside the production workspace.
[package]
name = "round9-hub-probe"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
alva-hub-core = { path = "../../../../crates/alva-hub-core" }
alva-engine-runtime = { path = "../../../../crates/alva-engine-runtime" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
async-trait = "0.1"
[[bin]]
name = "cancel_claim_gap"
path = "cancel_claim_gap.rs"
[[bin]]
name = "handoff_native"
path = "handoff_native.rs"
