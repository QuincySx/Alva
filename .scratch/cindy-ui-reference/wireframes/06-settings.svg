<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>.f{fill:#fff;stroke:#111;stroke-width:2}.p{fill:#f7f7f7;stroke:#333;stroke-width:1.3}.c{fill:#fff;stroke:#666;stroke-width:1.1}.t{font:15px system-ui;fill:#111}.h{font:bold 22px system-ui;fill:#111}.m{font:13px system-ui;fill:#666}.s{font:11px system-ui;fill:#555}</style>
  <rect class="f" x="1" y="1" width="1438" height="898" rx="12"/><text class="h" x="34" y="54">‹ 设置</text>
  <rect class="p" x="22" y="82" width="210" height="42" rx="21"/><text class="t" x="42" y="108">通用</text>
