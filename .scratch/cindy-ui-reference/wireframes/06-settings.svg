  <text class="h" x="360" y="98">通用</text><text class="m" x="360" y="124">每个设置页使用相同的内容宽度与卡片规则。</text>
  <rect class="c" x="360" y="154" width="800" height="84" rx="12"/><text class="t" x="386" y="184">账户</text><text class="m" x="386" y="208">头像、名称与账号信息</text><text class="t" x="1110" y="198">✎</text>
