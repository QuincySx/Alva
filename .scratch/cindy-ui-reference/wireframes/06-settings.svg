  <rect class="c" x="360" y="558" width="800" height="190" rx="12"/><text class="t" x="386" y="590">界面字体</text><rect class="p" x="386" y="606" width="718" height="38" rx="8"/><text class="m" x="402" y="630">Inter（默认）⌄</text><text class="t" x="386" y="682">界面字号</text><line x1="386" y1="710" x2="1000" y2="710" stroke="#777" stroke-width="3"/><circle cx="520" cy="710" r="8" fill="#fff" stroke="#333"/><rect class="p" x="1030" y="692" width="74" height="38" rx="10"/><text class="t" x="1054" y="717">14</text>
