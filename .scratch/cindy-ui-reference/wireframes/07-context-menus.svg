<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>.f{fill:#fff;stroke:#111;stroke-width:2}.p{fill:#f7f7f7;stroke:#333;stroke-width:1.3}.c{fill:#fff;stroke:#666;stroke-width:1.1}.t{font:15px system-ui;fill:#111}.h{font:bold 20px system-ui;fill:#111}.m{font:13px system-ui;fill:#666}.s{font:11px system-ui;fill:#555}</style>
  <rect class="f" x="1" y="1" width="1438" height="898" rx="12"/><rect class="p" x="1" y="1" width="300" height="898"/>
  <text class="h" x="28" y="54">项目与会话</text><text class="s" x="28" y="100">项目</text><text class="t" x="28" y="136">▱ alva-agent</text><rect class="c" x="18" y="154" width="264" height="38" rx="19"/><text class="t" x="36" y="179">◉ 当前任务</text><text class="m" x="36" y="222">◌ 历史任务 A</text><text class="m" x="36" y="256">◌ 历史任务 B</text>
  <rect class="c" x="330" y="86" width="270" height="342" rx="10"/><text class="h" x="352" y="120">项目右键菜单</text><text class="t" x="352" y="158">重命名项目</text><text class="t" x="352" y="192">置顶项目</text><line x1="348" y1="210" x2="582" y2="210" stroke="#bbb"/><text class="t" x="352" y="240">搜索任务…</text><text class="t" x="352" y="274">查看文件</text><text class="t" x="352" y="308">在文件管理器中打开</text><line x1="348" y1="326" x2="582" y2="326" stroke="#bbb"/><text class="t" x="352" y="356">复制深度链接</text><text class="t" x="352" y="390">同步 Codex 任务</text><text class="t" x="352" y="420">移除 / 全部归档</text>
  <rect class="c" x="640" y="86" width="270" height="342" rx="10"/><text class="h" x="662" y="120">会话右键菜单</text><text class="t" x="662" y="158">置顶</text><text class="t" x="662" y="192">重命名</text><text class="t" x="662" y="226">移动到项目 ›</text><line x1="658" y1="244" x2="892" y2="244" stroke="#bbb"/><text class="t" x="662" y="274">在分栏中打开</text><text class="t" x="662" y="308">复制任务链接</text><text class="t" x="662" y="342">在新窗口打开</text><text class="t" x="662" y="376">导出任务…</text><line x1="658" y1="394" x2="892" y2="394" stroke="#bbb"/><text class="t" x="662" y="422">归档 / 删除</text>
  <rect class="c" x="950" y="86" width="300" height="260" rx="10"/><text class="h" x="972" y="120">项目选择器</text><text class="s" x="972" y="150">对话或选择项目</text><text class="t" x="972" y="184">◯ 对话</text><text class="s" x="972" y="216">项目</text><rect class="p" x="968" y="230" width="264" height="56" rx="8"/><text class="t" x="986" y="254">▱ alva-agent</text><text class="s" x="986" y="276">/workspace/alva-agent</text><text class="t" x="972" y="320">⊞ 选择其他项目文件夹</text>
  <text class="h" x="330" y="508">交互原则</text><text class="m" x="330" y="546">1. 左栏用于对象导航，不把管理按钮永久铺满。</text><text class="m" x="330" y="580">2. 高频动作在 hover 时出现，完整动作收进右键菜单。</text><text class="m" x="330" y="614">3. 项目负责上下文；会话可以移动、分栏、导出、归档。</text><text class="m" x="330" y="648">4. 新对话先选“纯对话 / 项目”，而不是先进入复杂设置页。</text>
</svg>
