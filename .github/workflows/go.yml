# INPUT: Go source, pinned Go modules and local-only protocol/desktop fixtures
# OUTPUT: Portable SDK, race/vet, architecture and native compile gates
# POS: Repository CI for the sole maintained Go implementation
name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: go.sum
      - run: go mod download
      - run: go mod verify
      - name: Real Windows DACL, LockFileEx, atomic job and inherited stdin regressions
        run: go test -mod=readonly -count=1 ./platform/system/privatefs ./platform/storage/sqlite ./platform/system/process ./platform/system/secretinput ./platform/system/lineinput
      - name: Actual portable UI diagnostic HTTP and private-file MCP stdio
        run: go test -mod=readonly -count=1 ./apps/debug ./cmd/alva-devtools-mcp
      - name: Windows read-only media stdin and delete-on-close snapshots
        run: go test -mod=readonly -count=1 ./platform/system/media -run 'TestMediaSnapshotHelper|TestWindowsInputSnapshotAndHandleBinding'
      - name: Windows actual WASI SDK file roundtrip and native file capabilities
        run: go test -mod=readonly -count=1 ./platform/sandbox/host -run 'TestWindowsWASI|TestWASIReadonlyCreate|TestWASIActualSDKModelToolModelAndReferenceRetrieval|TestActualQuickJS|TestScriptHeapStack|TestScriptFuelExhaustionAfterLoopEntryCancelsOwner'
      - name: Windows portable SDK and architecture
        run: go test -mod=readonly -count=1 ./sdk/... ./tests/architecture
      - name: All Windows native commands without cgo
        run: go build -mod=readonly -tags desktop ./cmd/...
      - name: Windows platform static checks
        run: go vet -mod=readonly -tags desktop ./platform/... ./extension/loader ./integration/engine/process ./cmd/...
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: go.sum
      - run: go mod download
      - run: go mod verify
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Full native and headless race regressions
        # Metered SDK and CLI cases include native compilation in their real
        # wall-clock budget. Do not compete cold compilers across packages;
        # each package's actual concurrency/race tests still run unchanged.
        run: go test -mod=readonly -race -p 1 -count=1 -tags desktop ./...
      - name: Static checks and tagged dependency firewall
        run: go vet -mod=readonly -tags desktop ./...
      - name: Browser-portable SDK
        env:
          CGO_ENABLED: '0'
          GOOS: js
          GOARCH: wasm
        run: go build -mod=readonly ./sdk/... ./integration/llm/codec ./extension/planning ./extension/interaction ./extension/utility ./extension/utility/timer
      - name: WASIp1-portable SDK
        env:
          CGO_ENABLED: '0'
          GOOS: wasip1
          GOARCH: wasm
        run: |
          go build -mod=readonly ./sdk/... ./integration/llm/codec ./extension/planning ./extension/interaction ./extension/utility ./extension/utility/timer
          go build -mod=readonly -o build/alva-worker.wasm ./cmd/alva-worker-wasm
      - name: Native executables without cgo
        env:
          CGO_ENABLED: '0'
        run: |
          go build -mod=readonly -o build/alva ./cmd/alva
          go build -mod=readonly -o build/alva-gateway ./cmd/alva-gateway
          go build -mod=readonly -o build/alva-hub-server ./cmd/alva-hub-server
          go build -mod=readonly -o build/alva-hub ./cmd/alva-hub
          go build -mod=readonly -o build/alva-devtools-mcp ./cmd/alva-devtools-mcp
          go build -mod=readonly -tags desktop -o build/alva-desktop ./cmd/alva-desktop
          go build -mod=readonly -tags desktop -o build/alva-hub-desktop ./cmd/alva-hub-desktop
